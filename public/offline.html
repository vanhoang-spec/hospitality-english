<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Không có mạng — Hospitality English Academy</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <style>
      /* Deliberately self-contained. This page is served when the network
         is gone, so it cannot depend on a stylesheet, a font or a script
         that may not be in the cache. */
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a192f;
        color: #e8eaf0;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 24px 0 0;
        color: #d4af37;
      }
      p {
        margin: 12px 0 0;
        line-height: 1.6;
        font-size: 0.95rem;
        color: rgba(232, 234, 240, 0.75);
      }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 28px;
        border: 1px solid #d4af37;
        color: #d4af37;
        text-decoration: none;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Chưa có kết nối mạng</h1>
      <p>
        Thiết bị của bạn đang mất mạng nên không tải được trang này. Các trang bạn đã mở trước đó
        vẫn xem lại được khi ngoại tuyến.
      </p>
      <p>Tiến độ bạn đã học vẫn được lưu và sẽ đồng bộ khi có mạng trở lại.</p>
      <a href="/">Thử lại</a>
    </main>
  </body>
</html>
